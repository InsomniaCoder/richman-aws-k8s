apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noe
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    chart: noe
    repoURL: https://adevinta.github.io/noe/
    targetRevision: {{ .Values.noe.version | quote }}
    helm:
      valuesObject:
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
        # DaemonSet must run on all nodes — tolerate every taint
        tolerations:
          - operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]

apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "{{ .Values.clusterName }}-{{ .Values.environment }}-eks-node-role"
  subnetSelectorTerms:
    - tags:
        kubernetes.io/cluster/{{ .Values.clusterName }}: "shared"
  securityGroupSelectorTerms:
    - tags:
        Name: "{{ .Values.clusterName }}-nodes-sg"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        kmsKeyID: aws/ebs
  tags:
    Cluster: {{ .Values.clusterName | quote }}
    Environment: {{ .Values.environment | quote }}
    ManagedBy: karpenter

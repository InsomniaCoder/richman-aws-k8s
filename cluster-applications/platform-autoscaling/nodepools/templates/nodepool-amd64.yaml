# Preferred pool: newest generation AMD64 instances (gen 7+).
# Higher weight (100) means Karpenter schedules here first.
# When SPOT availability is low for gen 7, the overlay pool (gen 5-6, weight 10) provides fallback.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-amd64
spec:
  weight: 100
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          # Gen 6 = 6, so Gt 6 = gen 7+: m7i, m7a, c7i, r7i
          values: ["6"]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      # Business hours: no voluntary disruption — consolidation waves during working hours
      # cause pod evictions that impact SLOs. Block all voluntary node removal.
      - schedule: "0 9 * * 1-5"
        duration: 8h
        nodes: "0"
      # Off-hours: allow up to 10% replacement per cron window for drift cleanup.
      # Staggered at :00/:15/:30/:45 — offset from arm64 (:05/:20/:35/:50) to
      # prevent simultaneous multi-pool replacement waves.
      - schedule: "{{ .Values.nodePools.generalAmd64.disruptionBudgetSchedule | default \"0,15,30,45 * * * *\" }}"
        duration: 10m
        nodes: "10%"
  limits:
    cpu: 1000
    memory: 4000Gi
---
# Overlay pool: older generation AMD64 instances (gen 5-6).
# Lower weight (10) means Karpenter only uses this when preferred pools cannot satisfy demand.
# Provides SPOT fallback when gen 7 capacity is unavailable in a given AZ.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-amd64-overlay
spec:
  weight: 10
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: In
          # gen 5 and gen 6: m5, m6i, m6a, c5, c6i, r5, r6i
          values: ["5", "6"]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - schedule: "0 9 * * 1-5"
        duration: 8h
        nodes: "0"
      - schedule: "{{ .Values.nodePools.generalAmd64Overlay.disruptionBudgetSchedule | default \"0,15,30,45 * * * *\" }}"
        duration: 10m
        nodes: "10%"
  limits:
    cpu: 500
    memory: 2000Gi

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    # Delete=false — Kyverno deletion cascades to CRD deletion. With Enforce policies in place,
    # CRD removal causes the admission webhook to fail-close: no pods can be created cluster-wide.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: default
  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno/
    targetRevision: {{ .Values.kyverno.version | quote }}
    helm:
      valuesObject:
        # Admission controller is in the critical path for ALL pod creation.
        admissionController:
          # 3 replicas: single replica = cluster-wide SPOF for pod scheduling (webhook unavailability = no pods start)
          replicas: {{ .Values.kyverno.admissionReplicas }}
          priorityClassName: system-cluster-critical
          # System-node placement: webhook must not be on evictable workload nodes.
          # A disrupted webhook during an incident blocks all pod recovery attempts.
          tolerations:
            - key: system-node
              operator: Equal
              value: "true"
              effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: system-node
                        operator: In
                        values:
                          - "true"
          resources:
            # CPU request = limit — no bursting on admission webhook path
            requests:
              cpu: 1
              memory: 256Mi
            limits:
              cpu: 1
              memory: 256Mi
          rbac:
            coreClusterRole:
              extraResources:
                # Allow Kyverno to read Karpenter objects for policy validation
                - apiGroups: [karpenter.sh]
                  resources: [nodeclaims, nodepools]
                  verbs: [get, list, watch]
        config:
          # Binding exclusion: Kyverno intercepts the Binding webhook used by the scheduler.
          # Intercepting Bindings adds ~10-50ms latency to every pod placement — at scale this degrades scheduling throughput significantly.
          resourceFiltersExclude:
            - "[Binding,*,*]"
            - "[Pod/binding,*,*]"
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # Kyverno updates CRD annotations on every controller startup. Without this, ArgoCD
  # permanently shows the app as OutOfSync and may revert CRD annotations, causing reconcile loops.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels

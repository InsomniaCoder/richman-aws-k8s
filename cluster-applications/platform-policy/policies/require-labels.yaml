apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
spec:
  # Audit — enforcing labels on existing workloads would require a cluster-wide rollout.
  # Use this to identify unlabeled workloads, then enforce in new namespaces or via namespace admission.
  validationFailureAction: Audit
  rules:
    - name: require-app-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
      validate:
        message: "Deployments must have app.kubernetes.io/name and app.kubernetes.io/version labels."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/version: "?*"

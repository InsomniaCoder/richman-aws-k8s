apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: no-latest-image-tag
spec:
  validationFailureAction: Enforce
  rules:
    - name: no-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Image tag 'latest' is not allowed. Pin a specific version."
        # Two conditions needed: ":latest" explicit AND missing ":" entirely.
        # A bare image name like "nginx" (no tag) is equivalent to "nginx:latest" —
        # the registry silently pulls latest. Without the NotContains check, "nginx" bypasses enforcement.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image }}"
                    operator: NotContains
                    value: ":"
